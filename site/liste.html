<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelime listesi · Kilit Kelime</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Bir kelime listesi seninle paylaşıldı</h1>
<p class="muted">Listeyi Kilit Kelime uygulamasında açıp kendi listelerine ekleyebilirsin.</p>
<div class="card">
<p><a id="open" href="#">Uygulamada aç</a></p>
<p class="muted">Uygulama yüklü değilse App Store'da "Kilit Kelime" diye arat.</p>
</div>
</main>
<script>
  const id = new URLSearchParams(location.search).get("id") || "";
  if (/^[0-9a-fA-F-]{36}$/.test(id)) {
    const link = "kelime://list/" + id.toLowerCase();
    document.getElementById("open").href = link;
    location.href = link;
  }
</script>
</body>
</html>
