# Publishes site/ (privacy policy, terms) and the app's content (content/manifest.json,
# content/cards.json from Content/cards.json) to GitHub Pages:
# https://enesseval.github.io/kelime/
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "Content/cards.json", "tools/publish_content.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 tools/publish_content.py site/content
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
